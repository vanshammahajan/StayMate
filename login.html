<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background-color: #0056b3;
        }

        .register {
            text-align: center;
            margin-top: 15px;
        }

        .register a {
            text-decoration: none;
            color: #007bff;
        }

        .register a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div>
    <div class="landing-container">
        <h1>RoomMate Finder</h1>
       <img src="img.jpg" style="height:600px ; width: 900px;"> </img>
        <p>We offer awesome services that help you grow. Start your journey with us today.</p>
        <!-- <a href="/login" class="btn">Get Started</a> -->
      </div>
    <div class="container">
        <h2>Login</h2>
        <form action="{{ url_for('login') }}" method="post">
            <label for="username">Email:</label>
            <input type="email" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" name="password" id="password" required>

            <button type="submit">Login</button>
        </form>

        <div class="register">
            <p>Don't have an account? 
                <a href="{{ url_for('register_form') }}">Register</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
