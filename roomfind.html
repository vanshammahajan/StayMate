<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Find Roommate</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f2f2f2;
    }

    nav {
      margin-bottom: 30px;
    }

    nav a {
      text-decoration: none;
      margin-right: 20px;
      padding: 10px 15px;
      background-color: #007bff;
      color: white;
      border-radius: 5px;
      transition: background-color 0.3s;
    }

    nav a:hover {
      background-color: #0056b3;
    }

    form {
      background-color: white;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 0 auto;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
      font-size: 16px;
    }

    button:hover {
      background-color: #218838;
    }
  </style>

  <script>
    function validateForm() {
      const city = document.forms["findForm"]["city"].value.trim();
      if (city === "") {
        alert("Please enter your city.");
        return false;
      }
      return true;
    }
  </script>
</head>
<body>

  <nav>
    <a href="{{ url_for('home') }}">Home</a>
  </nav>

  <form action="{{ url_for('room_search') }}" method="post">
    <label for="city">Enter your city</label>
    <input type="text" name="city" placeholder="e.g., Delhi, Mumbai" required>
    <button type="submit">Find Roommate</button>
  </form>

</body>
</html>
